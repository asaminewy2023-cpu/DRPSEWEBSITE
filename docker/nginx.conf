# Reverse proxy for the Sevp platform.
# Routes /admin and /api to the CMS, everything else to the website.
# Terminate TLS here in production (see docs/DEPLOYMENT.md).

upstream cms_upstream {
    server cms:3000;
}

upstream website_upstream {
    server website:3001;
}

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS in production (enable with certbot or manual certs).
    # server_name yourdomain.gov.et;
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location /admin/ {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CMS media uploads served statically (uploaded files live in the media volume).
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://website_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

